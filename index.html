<!doctype html>

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tao Yu</title>
    <script>
      // Fix for GitHub Pages subfolder hosting: redirect to trailing slash if missing
      (function() {
        var path = window.location.pathname;
        if (path.length > 1 && !path.endsWith('/') && !path.split('/').pop().includes('.')) {
          window.location.replace(window.location.href + '/');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div style="display: flex; justify-content: center; align-items: center; height: 100vh; font-family: sans-serif; color: #666;">
        正在加载应用... (Loading Application...)
      </div>
    </div>
    <script type="module" src="src/main.tsx"></script>
  </body>
</html>
